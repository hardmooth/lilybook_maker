name: tests

on:
  push:
  pull_request:

# An explicit shell makes GitHub run bash with "-o pipefail". Without it, "pytest | tee" would report
# the exit code of tee, and failing tests would leave the job green.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lilypond and TeX Live
        # texlive-latex-base + pdfpages (latex-recommended) suffice for tests/data/minimal_book;
        # tests/data/template_book additionally needs framed/wrapfig/relsize/hyphenat/mathtools (latex-extra),
        # libertine/marvosym (fonts-recommended, fonts-extra) and german (lang-german)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make lilypond latexmk poppler-utils \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-german

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install test requirements
        run: python -m pip install -r requirements_dev.txt

      - name: lilybook check on the template snapshot
        run: '"$GITHUB_WORKSPACE/lilybook" check'
        working-directory: tests/data/template_book

      - name: Run tests
        env:
          LILYBOOK_BOOKS: ${{ github.workspace }}/tests/data/template_book
        run: python -m pytest -m "not container" -ra --basetemp=pytest-tmp --junitxml=pytest-results.xml | tee pytest-output.txt

      - name: Fail if tests were skipped
        run: |
          if grep -q "SKIPPED" pytest-output.txt; then
            echo "::error::Some tests were skipped - the toolchain or LaTeX packages are probably incomplete."
            exit 1
          fi

      - name: Upload results, logs and built PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-output.txt
            pytest-tmp/**/lilybook.log
            pytest-tmp/**/document*.pdf
          if-no-files-found: ignore

  container:
    name: Container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install test requirements
        run: python -m pip install -r requirements_dev.txt

      # the host has neither lilypond nor TeX Live: everything runs inside the image
      - name: Run container tests
        run: python -m pytest -m container -ra --basetemp=pytest-tmp | tee pytest-output.txt

      - name: Fail if tests were skipped
        run: |
          if grep -q "SKIPPED" pytest-output.txt; then
            echo "::error::Some container tests were skipped - podman or docker is probably not usable."
            exit 1
          fi
