name: tests

on:
  push:
  pull_request:

env:
  # branch/tag of https://github.com/hardmooth/lilybook_template to build in the tests
  # TODO: switch to "master" once align_with_liederbuch is merged
  LILYBOOK_TEMPLATE_REF: align_with_liederbuch

jobs:
  linux:
    name: Linux (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lilybook_template
        uses: actions/checkout@v4
        with:
          repository: hardmooth/lilybook_template
          ref: ${{ env.LILYBOOK_TEMPLATE_REF }}
          path: books/lilybook_template

      - name: Install lilypond and TeX Live
        # texlive-latex-base suffices for tests/data/minimal_book; the template additionally needs
        # koma-script/pdfpages (latex-recommended), framed/wrapfig/relsize/hyphenat/mathtools (latex-extra),
        # libertine/marvosym (fonts-recommended, fonts-extra) and german (lang-german)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lilypond \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-german
          lilypond --version | head -1
          lilypond-book --version
          pdflatex --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install python requirements
        run: python -m pip install -r requirements_dev.txt

      - name: Check prerequisites
        run: bash "$GITHUB_WORKSPACE/lilybook.sh" --check
        working-directory: books/lilybook_template

      - name: Run tests
        env:
          LILYBOOK_BOOKS: ${{ github.workspace }}/books/lilybook_template
        run: python -m pytest -ra --basetemp=pytest-tmp --junitxml=pytest-results.xml | tee pytest-output.txt

      - name: Fail if tests were skipped
        run: |
          if grep -q "SKIPPED" pytest-output.txt; then
            echo "::error::Some tests were skipped - the toolchain or LaTeX packages are probably incomplete."
            exit 1
          fi

      - name: Upload results, logs and built PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-linux-py${{ matrix.python }}
          path: |
            pytest-results.xml
            pytest-output.txt
            pytest-tmp/**/create_pdf.log
            pytest-tmp/**/document*.pdf
          if-no-files-found: ignore

  # Windows is the original platform. MiKTeX installs missing packages on the fly, which makes this
  # job slow (several minutes); it is therefore allowed to fail without blocking the branch.
  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lilybook_template
        uses: actions/checkout@v4
        with:
          repository: hardmooth/lilybook_template
          ref: ${{ env.LILYBOOK_TEMPLATE_REF }}
          path: books/lilybook_template

      - name: Install lilypond and MiKTeX
        shell: pwsh
        run: |
          choco install -y --no-progress lilypond miktex
          # make the tools of this run visible to later steps
          "C:\Program Files (x86)\LilyPond\usr\bin"      | Out-File -Append $env:GITHUB_PATH
          "C:\Program Files\LilyPond\usr\bin"            | Out-File -Append $env:GITHUB_PATH
          "C:\Program Files\MiKTeX\miktex\bin\x64"       | Out-File -Append $env:GITHUB_PATH
          "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64" | Out-File -Append $env:GITHUB_PATH

      - name: Configure MiKTeX to install packages automatically
        shell: pwsh
        run: |
          initexmf --set-config-value "[MPM]AutoInstall=1"
          miktex packages update-package-database
          miktex packages install makeindex

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python requirements
        run: python -m pip install -r requirements_dev.txt

      - name: Run tests
        env:
          LILYBOOK_BOOKS: ${{ github.workspace }}\books\lilybook_template
        run: python -m pytest -ra
